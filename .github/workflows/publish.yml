# 发布链路：先在 TestPyPI 预演，GitHub Release 时才发正式 PyPI。
# 采用 Trusted Publishing（OIDC），仓库里不保存任何 API Token。
#
# 首次发布前的一次性配置（人工，两个平台各做一遍）：
#   1. TestPyPI 后台 → Publishing → Add a new pending trusted publisher：
#        PyPI Project Name: lerobot-data-quality
#        Owner: 15389065619    Repository: lerobot-data-quality
#        Workflow: publish.yml Environment: testpypi
#   2. PyPI 后台同样配置一份，Environment 填 release
#   3. GitHub 仓库 Settings → Environments 新建 testpypi 与 release（先不加 protection rules）
#
# 预演：Actions 里手动 Run workflow（workflow_dispatch）→ 只上传 TestPyPI
# 正式：打 tag 后在 GitHub 创建 Release（published）→ 先 TestPyPI 再 PyPI
name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:   # 手动触发 = 只做 TestPyPI 预演，不碰正式 PyPI

jobs:
  build:
    name: 构建并校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            pyproject.toml

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt build twine

      - name: 先跑测试，避免带着回归发布
        run: python -m pytest tests -q

      - name: 构建 sdist + wheel
        run: python -m build

      - name: 校验产物元数据
        run: python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    name: 上传 TestPyPI（预演）
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/lerobot-data-quality
    permissions:
      id-token: write   # Trusted Publishing 必需；漏了会直接失败
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: 上传正式 PyPI
    needs: publish-testpypi   # 预演不通过就不碰正式仓库
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/p/lerobot-data-quality
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
