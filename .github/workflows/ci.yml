# CI：多 Python 版本单元测试
# 触发：main 分支 push、全部 pull_request
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # 一个版本挂了不影响其他版本跑完，便于看全版本兼容性
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip   # 缓存 pip 依赖，加速后续运行

      - name: 安装 ffmpeg（视频探针是测试依赖）
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: 安装 Python 依赖
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: 运行测试
        run: python -m pytest tests -v
