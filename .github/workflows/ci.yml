name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # 一个版本挂了不影响其他版本跑完，便于看全版本兼容性
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip   # 缓存 ~/.cache/pip（setup-python 自动处理，无需手写 actions/cache）
          # 依赖文件变化才失效缓存：三个版本共用同一份 key 前缀，装的是同一套依赖
          cache-dependency-path: |
            requirements*.txt
            pyproject.toml

      - name: 安装 ffmpeg（视频探针是测试依赖）
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: 安装 Python 依赖
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      # 覆盖率门槛只在最新的 3.12 上强制；3.10/3.11 只跑测试，避免环境差异长期把 CI 弄红
      - name: 运行测试
        run: |
          if [ "${{ matrix.python-version }}" = "3.12" ]; then
            python -m pytest tests -q --cov --cov-report=term-missing --cov-report=xml
          else
            python -m pytest tests -q
          fi

      - name: 上传覆盖率报告
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-3.12
          path: coverage.xml
          if-no-files-found: warn
