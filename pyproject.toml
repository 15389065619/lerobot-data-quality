# 打包配置：setuptools 后端
# 安装：pip install .            —— 提供 console 命令 lerobot-data-quality
# 开发：pip install -e .[dev]    —— 可编辑安装 + pytest
[build-system]
requires = ["setuptools>=61"]   # 61 起原生支持 [project] 表
build-backend = "setuptools.build_meta"

[project]
name = "lerobot-data-quality"
version = "2.0.0"
description = "机器人多模态数据质量治理流水线：视频 / 动作 / 点云质检，Keep-Repair-Review-Drop 分级处置与可视化报告"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "wuliangzhong", email = "2904693443@qq.com" }
]
requires-python = ">=3.10"
# 依赖下限与 requirements.txt 保持一致
dependencies = [
    "pandas>=1.5",
    "pyarrow>=7.0",
    "numpy>=1.21",
    "matplotlib>=3.5",
    "tqdm>=4.60",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
hf = ["huggingface_hub>=0.23"]   # 仅 tools/publish_demo_to_hf.py 需要，发布演示数据集时安装
rosbag = ["rosbags>=0.9"]        # 仅 ROS Bag 适配器（adapters.rosbag）需要；
                                 # 纯 Python 解析库，不引入 ROS 环境。安装：pip install lerobot-data-quality[rosbag]

[project.urls]
Homepage = "https://github.com/15389065619/lerobot-data-quality"
Architecture = "https://github.com/15389065619/lerobot-data-quality/blob/main/ARCHITECTURE.md"

# console 入口：lerobot-data-quality = python main.py 的同义封装
[project.scripts]
lerobot-data-quality = "main:main"
lerobot-data-quality-precheck = "pipeline.precheck:main"
lerobot-data-quality-version = "pipeline.versions:main"
lerobot-data-quality-tune = "pipeline.tuning:main"
lerobot-data-quality-dashboard = "ui.dashboard_server:main"

# 覆盖率门槛只升不降；当前门槛低于本机基线，留出跨平台差异余量
[tool.coverage.run]
branch = true
source = ["pipeline", "adapters", "verticals"]

[tool.coverage.report]
fail_under = 64
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.setuptools]
py-modules = ["main"]   # 根目录单文件入口模块

[tool.setuptools.packages.find]
where = ["."]   # 适配器与垂直产线在仓库根目录
include = ["pipeline*", "tools*", "ui*", "evaluation*", "adapters*", "verticals*"]   # pipeline 含 cleaner/validator 子包
